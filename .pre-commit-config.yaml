repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.3.0
    hooks:
    -   id: check-yaml
    -   id: end-of-file-fixer
        # Translation catalogs are written by `just i18n`; keep its formatting.
        exclude: \.po$
    -   id: trailing-whitespace
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.0
    hooks:
    -   id: ruff
        args: [--fix]
    -   id: ruff-format
