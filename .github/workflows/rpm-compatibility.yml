name: RPM Compatibility

on:
  workflow_dispatch:

jobs:
  # =========================================================
  # Build the REAL Tuttle RPM from source on Fedora 44
  # =========================================================
  build-rpm:
    name: Build RPM on Fedora 44
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Tuttle RPM on Fedora 44
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            fedora:44 \
            bash -c '
              set -e

              echo "======================================"
              echo "Operating System"
              echo "======================================"

              cat /etc/os-release

              echo
              echo "======================================"
              echo "Install system dependencies"
              echo "======================================"

              dnf install -y \
                libxcrypt-compat \
                curl \
                git \
                gcc \
                gcc-c++ \
                make \
                rpm \
                rpm-build \
                python3 \
                python3-devel \
                jq \
                ca-certificates \
                tar \
                gzip

              echo
              echo "======================================"
              echo "Install Node.js 22"
              echo "======================================"

              curl -fsSL https://rpm.nodesource.com/setup_22.x | bash -
              dnf install -y nodejs

              node --version
              npm --version

              echo
              echo "======================================"
              echo "Install uv"
              echo "======================================"

              curl -LsSf https://astral.sh/uv/install.sh | sh
              export PATH="$HOME/.local/bin:$PATH"

              uv --version

              echo
              echo "======================================"
              echo "Install Python 3.13"
              echo "======================================"

              uv python install 3.13

              echo
              echo "======================================"
              echo "Install Python dependencies"
              echo "======================================"

              uv sync --all-groups

              echo
              echo "======================================"
              echo "Build Python core"
              echo "======================================"

              uv run pyinstaller \
                --clean \
                --noconfirm \
                tuttle-rpc.spec

              echo
              echo "======================================"
              echo "Smoke test Python core"
              echo "======================================"

              uv run python scripts/smoke_core.py

              echo
              echo "======================================"
              echo "Install Electron dependencies"
              echo "======================================"

              cd ui

              npm ci

              echo
              echo "======================================"
              echo "Build Electron app"
              echo "======================================"

              npm run build

              echo
              echo "======================================"
              echo "Build RPM"
              echo "======================================"

              npx electron-builder \
                --linux rpm \
                --publish never

              echo
              echo "======================================"
              echo "Generated RPM"
              echo "======================================"

              find release -type f -name "*.rpm" -print
            '

      - name: Verify RPM was generated
        run: |
          echo "======================================"
          echo "Generated RPM"
          echo "======================================"

          find ui/release -type f -name "*.rpm" -print

          RPM_COUNT=$(find ui/release -type f -name "*.rpm" | wc -l)

          if [ "$RPM_COUNT" -eq 0 ]; then
            echo "❌ FAIL: No RPM generated"
            exit 1
          fi

          echo "✅ Found $RPM_COUNT RPM"

      - name: Inspect RPM dependencies
        run: |
          RPM=$(find ui/release -type f -name "*.rpm" | head -n 1)

          echo "======================================"
          echo "RPM information"
          echo "======================================"

          rpm -qip "$RPM"

          echo
          echo "======================================"
          echo "RPM dependencies"
          echo "======================================"

          rpm -qp --requires "$RPM"

          echo
          echo "======================================"
          echo "FUSE dependencies"
          echo "======================================"

          rpm -qp --requires "$RPM" | grep -i fuse || true

      - name: Upload RPM
        uses: actions/upload-artifact@v4
        with:
          name: tuttle-rpm
          path: ui/release/*.rpm
          if-no-files-found: error


  # =========================================================
  # Test the SAME RPM on RPM-based distributions
  # =========================================================
  rpm-test:
    name: ${{ matrix.name }}

    needs: build-rpm

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        include:
          - name: Fedora 44
            image: fedora:44

          - name: Rocky Linux 9
            image: rockylinux:9

          - name: AlmaLinux 9
            image: almalinux:9

          - name: CentOS Stream 9
            image: quay.io/centos/centos:stream9

          - name: Oracle Linux 9
            image: oraclelinux:9

    steps:
      - name: Download RPM
        uses: actions/download-artifact@v4
        with:
          name: tuttle-rpm
          path: /tmp/tuttle

      - name: Test RPM on ${{ matrix.name }}
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm \
            -v "/tmp/tuttle:/tmp/tuttle:ro" \
            "$IMAGE" \
            bash -c '
              set -e

              echo "======================================"
              echo "Operating System"
              echo "======================================"

              cat /etc/os-release

              echo
              echo "======================================"
              echo "Install RPM tools"
              echo "======================================"

              dnf install -y \
                rpm \
                dnf \
                ca-certificates

              RPM=$(find /tmp/tuttle -type f -name "*.rpm" | head -n 1)

              if [ -z "$RPM" ]; then
                echo "❌ FAIL: RPM not found"
                exit 1
              fi

              echo
              echo "======================================"
              echo "RPM information"
              echo "======================================"

              rpm -qip "$RPM"

              echo
              echo "======================================"
              echo "RPM dependencies"
              echo "======================================"

              rpm -qp --requires "$RPM"

              echo
              echo "======================================"
              echo "FUSE dependencies"
              echo "======================================"

              rpm -qp --requires "$RPM" | grep -i fuse || true

              echo
              echo "======================================"
              echo "Testing installation"
              echo "======================================"

              dnf install -y "$RPM"

              echo
              echo "======================================"
              echo "Verify installation"
              echo "======================================"

              rpm -qa | grep -i "^tuttle"

              echo
              echo "======================================"
              echo "Install Xvfb (virtual display)"
              echo "======================================"

              dnf install -y xorg-x11-server-Xvfb

              echo
              echo "======================================"
              echo "Locate app binary"
              echo "======================================"

              BINARY=$(rpm -ql tuttle | grep -E "^/usr/bin/|^/opt/.*/[Tt]uttle$" | head -n 1)

              if [ -z "$BINARY" ]; then
                echo "❌ FAIL: Could not locate app binary"
                rpm -ql tuttle
                exit 1
              fi

              echo "Binary: $BINARY"

              echo
              echo "======================================"
              echo "Smoke test app under Xvfb (display)"
              echo "======================================"

              rm -rf /tmp/crash-reports
              mkdir -p /tmp/crash-reports

              set +e
              xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" \
                timeout 20s "$BINARY" \
                  --no-sandbox \
                  --disable-gpu \
                  --crash-dumps-dir=/tmp/crash-reports \
                  > /tmp/app-stdout.log 2>&1
              APP_EXIT=$?
              set -e

              echo "--- App stdout/stderr ---"
              cat /tmp/app-stdout.log || true

              echo
              echo "======================================"
              echo "Check for crash artifacts"
              echo "======================================"

              CRASH_FILES=$(find /tmp/crash-reports -type f 2>/dev/null | wc -l)
              CORE_FILES=$(find / -maxdepth 2 -name "core*" -newer /tmp/app-stdout.log 2>/dev/null | wc -l)

              echo "Crash dump files: $CRASH_FILES"
              echo "Core files: $CORE_FILES"
              echo "App exit code: $APP_EXIT"

              # Exit code 124 = timeout (expected for a long-running GUI app
              # that launched fine and had to be killed) -- treat as success.
              if [ "$APP_EXIT" -ne 0 ] && [ "$APP_EXIT" -ne 124 ]; then
                echo "❌ FAIL: App exited abnormally (code $APP_EXIT)"
                exit 1
              fi

              if [ "$CRASH_FILES" -gt 0 ] || [ "$CORE_FILES" -gt 0 ]; then
                echo "❌ FAIL: Crash artifacts detected"
                exit 1
              fi

              echo "✅ PASS: No crash on launch (${{ matrix.name }})"

              echo
              echo "======================================"
              echo "✅ PASS: ${{ matrix.name }}"
              echo "======================================"
            '
