name: RPM Compatibility

on:
  workflow_dispatch:

jobs:
  # =========================================================
  # Build the REAL Tuttle RPM from source on Fedora 44
  # =========================================================
  build-rpm:
    name: Build RPM on Fedora 44
    runs-on: ubuntu-latest

    steps:
      # -------------------------------------------------------
      # Checkout
      # -------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------------------------------------
      # Build RPM inside Fedora 44
      # -------------------------------------------------------
      - name: Build Tuttle RPM on Fedora 44
        run: |
          set -e

          echo "======================================"
          echo "Pull Fedora 44"
          echo "======================================"

          docker pull fedora:44

          echo "======================================"
          echo "Build Tuttle RPM inside Fedora 44"
          echo "======================================"

          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            fedora:44 \
            bash -lc '
              set -e

              echo "======================================"
              echo "Operating System"
              echo "======================================"

              cat /etc/os-release

              echo
              echo "======================================"
              echo "Install system dependencies"
              echo "======================================"

              dnf install -y \
                libxcrypt-compat \
                curl \
                git \
                gcc \
                gcc-c++ \
                make \
                rpm \
                rpm-build \
                python3 \
                python3-devel \
                jq \
                ca-certificates \
                tar \
                gzip \
                findutils

              echo
              echo "======================================"
              echo "Install Node.js 22"
              echo "======================================"

              curl -fsSL https://rpm.nodesource.com/setup_22.x | bash -
              dnf install -y nodejs

              echo
              echo "Node version:"
              node --version

              echo
              echo "npm version:"
              npm --version

              echo
              echo "======================================"
              echo "Install uv"
              echo "======================================"

              curl -LsSf https://astral.sh/uv/install.sh | sh

              export PATH="$HOME/.local/bin:$PATH"

              echo
              uv --version

              echo
              echo "======================================"
              echo "Install Python 3.13"
              echo "======================================"

              uv python install 3.13

              echo
              echo "Python versions:"
              uv python list

              echo
              echo "======================================"
              echo "Install Python dependencies"
              echo "======================================"

              uv sync --all-groups

              echo
              echo "======================================"
              echo "Build Python core"
              echo "======================================"

              uv run pyinstaller \
                --clean \
                --noconfirm \
                tuttle-rpc.spec

              echo
              echo "======================================"
              echo "Smoke test Python core"
              echo "======================================"

              uv run python scripts/smoke_core.py

              echo
              echo "======================================"
              echo "Install Electron dependencies"
              echo "======================================"

              cd ui

              npm ci

              echo
              echo "======================================"
              echo "Build Electron application"
              echo "======================================"

              npm run build

              echo
              echo "======================================"
              echo "Build RPM"
              echo "======================================"

              npx electron-builder \
                --linux rpm \
                --publish never

              echo
              echo "======================================"
              echo "Generated RPM files"
              echo "======================================"

              find release \
                -type f \
                -name "*.rpm" \
                -print

              RPM_COUNT=$(find release -type f -name "*.rpm" | wc -l)

              if [ "$RPM_COUNT" -eq 0 ]; then
                echo "❌ FAIL: electron-builder did not generate an RPM"
                exit 1
              fi

              echo
              echo "✅ Successfully generated $RPM_COUNT RPM file(s)"
            '

      # -------------------------------------------------------
      # Verify RPM exists
      # -------------------------------------------------------
      - name: Verify RPM was generated
        run: |
          set -e

          echo "======================================"
          echo "Generated RPM"
          echo "======================================"

          find ui/release \
            -type f \
            -name "*.rpm" \
            -print

          RPM_COUNT=$(find ui/release -type f -name "*.rpm" | wc -l)

          if [ "$RPM_COUNT" -eq 0 ]; then
            echo "❌ FAIL: No RPM generated"
            exit 1
          fi

          echo "✅ Found $RPM_COUNT RPM file(s)"

      # -------------------------------------------------------
      # Install RPM tool on GitHub runner
      # -------------------------------------------------------
      - name: Install RPM inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      # -------------------------------------------------------
      # Inspect RPM
      # -------------------------------------------------------
      - name: Inspect RPM dependencies
        run: |
          set -e

          RPM=$(find ui/release \
            -type f \
            -name "*.rpm" \
            | head -n 1)

          if [ -z "$RPM" ]; then
            echo "❌ RPM not found"
            exit 1
          fi

          echo "======================================"
          echo "RPM information"
          echo "======================================"

          rpm -qip "$RPM"

          echo
          echo "======================================"
          echo "RPM dependencies"
          echo "======================================"

          rpm -qp --requires "$RPM"

          echo
          echo "======================================"
          echo "FUSE dependencies"
          echo "======================================"

          rpm -qp --requires "$RPM" | grep -i fuse || true

      # -------------------------------------------------------
      # Upload RPM
      # -------------------------------------------------------
      - name: Upload RPM
        uses: actions/upload-artifact@v4
        with:
          name: tuttle-rpm
          path: ui/release/*.rpm
          if-no-files-found: error


  # =========================================================
  # Test SAME RPM on RPM-based distributions
  # =========================================================
  rpm-test:
    name: ${{ matrix.name }}

    needs: build-rpm

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        include:
          - name: Fedora 44
            image: fedora:44

          - name: Rocky Linux 9
            image: rockylinux:9

          - name: AlmaLinux 9
            image: almalinux:9

          - name: CentOS Stream 9
            image: quay.io/centos/centos:stream9

          - name: Oracle Linux 9
            image: oraclelinux:9

    steps:
      # -------------------------------------------------------
      # Download RPM
      # -------------------------------------------------------
      - name: Download RPM
        uses: actions/download-artifact@v4
        with:
          name: tuttle-rpm
          path: /tmp/tuttle

      # -------------------------------------------------------
      # Verify downloaded RPM on host
      # -------------------------------------------------------
      - name: Verify downloaded RPM
        run: |
          set -e

          echo "======================================"
          echo "Downloaded RPM"
          echo "======================================"

          find /tmp/tuttle \
            -type f \
            -name "*.rpm" \
            -print

          RPM_COUNT=$(find /tmp/tuttle \
            -type f \
            -name "*.rpm" \
            | wc -l)

          if [ "$RPM_COUNT" -eq 0 ]; then
            echo "❌ FAIL: RPM artifact not found"
            exit 1
          fi

          echo "✅ Found $RPM_COUNT RPM file(s)"

      # -------------------------------------------------------
      # Pull test image
      # -------------------------------------------------------
      - name: Pull ${{ matrix.name }} image
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          set -e

          echo "======================================"
          echo "Pull Docker image"
          echo "======================================"

          echo "Image: $IMAGE"

          docker pull "$IMAGE"

          echo "✅ Docker image pulled successfully"

      # -------------------------------------------------------
      # Test RPM
      # -------------------------------------------------------
      - name: Test RPM on ${{ matrix.name }}
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          set -e

          docker run --rm \
            -v "/tmp/tuttle:/tmp/tuttle:ro" \
            "$IMAGE" \
            bash -lc '
              set -e

              echo "======================================"
              echo "Operating System"
              echo "======================================"

              cat /etc/os-release

              echo
              echo "======================================"
              echo "Install RPM tools"
              echo "======================================"

              dnf install -y \
                rpm \
                dnf \
                ca-certificates \
                findutils

              echo
              echo "======================================"
              echo "Locate RPM"
              echo "======================================"

              RPM=$(find /tmp/tuttle \
                -type f \
                -name "*.rpm" \
                | head -n 1)

              if [ -z "$RPM" ]; then
                echo "❌ FAIL: RPM not found"
                exit 1
              fi

              echo "RPM: $RPM"

              echo
              echo "======================================"
              echo "RPM information"
              echo "======================================"

              rpm -qip "$RPM"

              echo
              echo "======================================"
              echo "RPM dependencies"
              echo "======================================"

              rpm -qp --requires "$RPM"

              echo
              echo "======================================"
              echo "FUSE dependencies"
              echo "======================================"

              rpm -qp --requires "$RPM" | grep -i fuse || true

              echo
              echo "======================================"
              echo "Testing RPM installation"
              echo "======================================"

              dnf install -y "$RPM"

              echo
              echo "======================================"
              echo "Verify Tuttle RPM installation"
              echo "======================================"

              echo "RPM package status:"
              rpm -q tuttle

              echo
              echo "Installed files:"
              rpm -ql tuttle

              echo
              echo "Tuttle-related files:"
              rpm -ql tuttle | grep -Ei "tuttle|/bin/" || true

              echo
              echo "Searching filesystem:"
              find /usr /opt \
                -iname "*tuttle*" \
                -type f \
                2>/dev/null || true

              echo
              echo "======================================"
              echo "Verify package database"
              echo "======================================"

              rpm -qa | grep -i "^tuttle"

              echo
              echo "======================================"
              echo "Install Xvfb"
              echo "======================================"

              dnf install -y \
                xorg-x11-server-Xvfb \
                procps-ng \
                which

              echo
              echo "======================================"
              echo "Locate application binary"
              echo "======================================"

              BINARY=""

              # First try normal executable locations
              for candidate in \
                /usr/bin/tuttle \
                /usr/bin/Tuttle \
                /opt/tuttle/tuttle \
                /opt/Tuttle/Tuttle \
                /opt/Tuttle/tuttle
              do
                if [ -x "$candidate" ]; then
                  BINARY="$candidate"
                  break
                fi
              done

              # If not found, search RPM file list
              if [ -z "$BINARY" ]; then
                BINARY=$(rpm -ql tuttle \
                  | grep -E "/(tuttle|Tuttle)$" \
                  | head -n 1 || true)
              fi

              if [ -z "$BINARY" ]; then
                echo "❌ FAIL: Could not locate Tuttle executable"

                echo
                echo "Complete RPM file list:"
                rpm -ql tuttle

                exit 1
              fi

              echo "Binary: $BINARY"

              if [ ! -x "$BINARY" ]; then
                echo "❌ FAIL: Located file is not executable"
                ls -la "$BINARY"
                exit 1
              fi

              echo
              echo "======================================"
              echo "Binary information"
              echo "======================================"

              file "$BINARY"

              echo
              echo "======================================"
              echo "Check shared libraries"
              echo "======================================"

              if command -v ldd >/dev/null 2>&1; then
                ldd "$BINARY" || true
              fi

              echo
              echo "======================================"
              echo "Smoke test app under Xvfb"
              echo "======================================"

              rm -rf /tmp/crash-reports
              mkdir -p /tmp/crash-reports

              rm -f /tmp/app-stdout.log

              set +e

              xvfb-run \
                --auto-servernum \
                --server-args="-screen 0 1280x1024x24" \
                timeout 20s \
                "$BINARY" \
                --no-sandbox \
                --disable-gpu \
                --disable-dev-shm-usage \
                --crash-dumps-dir=/tmp/crash-reports \
                > /tmp/app-stdout.log 2>&1

              APP_EXIT=$?

              set -e

              echo
              echo "--- App stdout/stderr ---"
              cat /tmp/app-stdout.log || true

              echo
              echo "======================================"
              echo "Check crash artifacts"
              echo "======================================"

              CRASH_FILES=$(find /tmp/crash-reports \
                -type f \
                2>/dev/null \
                | wc -l)

              CORE_FILES=$(find / \
                -maxdepth 3 \
                -name "core*" \
                -type f \
                2>/dev/null \
                | wc -l)

              echo "Crash dump files: $CRASH_FILES"
              echo "Core files: $CORE_FILES"
              echo "App exit code: $APP_EXIT"

              echo
              echo "======================================"
              echo "Evaluate application result"
              echo "======================================"

              # 124 means timeout killed the process.
              # This is expected if the GUI launched successfully
              # and continued running for 20 seconds.
              if [ "$APP_EXIT" -ne 0 ] && [ "$APP_EXIT" -ne 124 ]; then
                echo "❌ FAIL: App exited abnormally"
                echo "Exit code: $APP_EXIT"
                exit 1
              fi

              if [ "$CRASH_FILES" -gt 0 ]; then
                echo "❌ FAIL: Crash dump files detected"
                find /tmp/crash-reports -type f -print
                exit 1
              fi

              if [ "$CORE_FILES" -gt 0 ]; then
                echo "❌ FAIL: Core dump files detected"
                exit 1
              fi

              echo
              echo "======================================"
              echo "✅ PASS: No crash on launch"
              echo "Distribution: ${{ matrix.name }}"
              echo "======================================"
            '
