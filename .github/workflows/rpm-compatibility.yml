name: RPM Compatibility

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tuttle release tag to test"
        required: true
        default: "v4.2.1"

jobs:
  rpm-test:
    name: ${{ matrix.name }}

    strategy:
      fail-fast: false

      matrix:
        include:
          - name: Fedora 44
            image: fedora:44

          - name: Rocky Linux 9
            image: rockylinux:9

          - name: AlmaLinux 9
            image: almalinux:9

          - name: CentOS Stream 9
            image: quay.io/centos/centos:stream9

          - name: Oracle Linux 9
            image: oraclelinux:9

    runs-on: ubuntu-latest

    container:
      image: ${{ matrix.image }}

    steps:
      # ---------------------------------------------------------
      # 1. Install tools
      # ---------------------------------------------------------
      - name: Install test tools
        run: |
          dnf install -y \
            curl \
            rpm \
            dnf \
            jq \
            ca-certificates

      # ---------------------------------------------------------
      # 2. Show OS
      # ---------------------------------------------------------
      - name: Show operating system
        run: |
          echo "======================================"
          echo "Operating System"
          echo "======================================"

          cat /etc/os-release

      # ---------------------------------------------------------
      # 3. Show repositories
      # ---------------------------------------------------------
      - name: Show enabled repositories
        run: |
          echo "======================================"
          echo "Enabled repositories"
          echo "======================================"

          dnf repolist

      # ---------------------------------------------------------
      # 4. Download RPM from GitHub Release
      # ---------------------------------------------------------
      - name: Download Tuttle RPM
        env:
          TAG: ${{ inputs.tag }}
        run: |
          echo "======================================"
          echo "Downloading Tuttle RPM"
          echo "Release: ${TAG}"
          echo "======================================"

          mkdir -p /tmp/tuttle

          # Get release metadata from GitHub
          curl -fsSL \
            "https://api.github.com/repos/tuttle-dev/tuttle/releases/tags/${TAG}" \
            -o /tmp/tuttle/release.json

          echo
          echo "Release assets:"
          jq -r '.assets[].browser_download_url' /tmp/tuttle/release.json || true

          # Download the first architecture-appropriate RPM asset (excluding debuginfo)
          RPM_URL=$(jq -r '.assets[] | select(.name | endswith(".rpm") and (contains("debuginfo") | not)) | .browser_download_url' /tmp/tuttle/release.json | head -n 1)

          if [ -z "$RPM_URL" ] || [ "$RPM_URL" = "null" ]; then
            echo "❌ FAIL: No valid RPM asset found in release ${TAG}"
            exit 1
          fi

          echo
          echo "RPM URL:"
          echo "$RPM_URL"

          curl -fL \
            "$RPM_URL" \
            -o /tmp/tuttle/tuttle.rpm

          echo
          echo "Downloaded RPM:"
          ls -lh /tmp/tuttle/tuttle.rpm

      # ---------------------------------------------------------
      # 5. Verify RPM
      # ---------------------------------------------------------
      - name: Verify RPM
        run: |
          RPM=/tmp/tuttle/tuttle.rpm

          echo "======================================"
          echo "RPM Information"
          echo "======================================"

          rpm -qip "$RPM"

      # ---------------------------------------------------------
      # 6. Inspect dependencies
      # ---------------------------------------------------------
      - name: Inspect Tuttle dependencies
        run: |
          RPM=/tmp/tuttle/tuttle.rpm

          echo "======================================"
          echo "Tuttle RPM dependencies"
          echo "======================================"

          rpm -qp --requires "$RPM"

          echo
          echo "======================================"
          echo "FUSE dependencies"
          echo "======================================"

          rpm -qp --requires "$RPM" | grep -i fuse || true

      # ---------------------------------------------------------
      # 7. Check fuse2-libs
      # ---------------------------------------------------------
      - name: Check fuse2-libs availability
        run: |
          RPM=/tmp/tuttle/tuttle.rpm

          echo "======================================"
          echo "Checking fuse2-libs"
          echo "======================================"

          if rpm -qp --requires "$RPM" | grep -q 'fuse2-libs'; then

            echo "Tuttle requires fuse2-libs"

            if dnf repoquery --whatprovides 'fuse2-libs' 2>/dev/null | grep -q .; then
              echo "✅ PASS: fuse2-libs is available"
            else
              echo "❌ FAIL: fuse2-libs is NOT available"
              exit 1
            fi

          else
            echo "ℹ️ Tuttle does not explicitly require fuse2-libs"
          fi

      # ---------------------------------------------------------
      # 8. Check libfuse.so.2
      # ---------------------------------------------------------
      - name: Check libfuse.so.2 availability
        run: |
          RPM=/tmp/tuttle/tuttle.rpm

          echo "======================================"
          echo "Checking libfuse.so.2"
          echo "======================================"

          if rpm -qp --requires "$RPM" | grep -q 'fuse2-libs'; then

            if dnf provides '*/libfuse.so.2' 2>/dev/null | grep -q .; then
              echo "✅ PASS: libfuse.so.2 is available"
            else
              echo "❌ FAIL: libfuse.so.2 is NOT available"
              exit 1
            fi

          else
            echo "ℹ️ libfuse.so.2 is not required by the RPM"
          fi

      # ---------------------------------------------------------
      # 9. Test actual installation
      # ---------------------------------------------------------
      - name: Test Tuttle RPM installation
        run: |
          RPM=/tmp/tuttle/tuttle.rpm

          echo "======================================"
          echo "Testing Tuttle installation"
          echo "======================================"

          if dnf install -y "$RPM"; then

            echo
            echo "======================================"
            echo "✅ PASS: Tuttle installed successfully"
            echo "======================================"

          else

            echo
            echo "======================================"
            echo "❌ FAIL: Tuttle installation failed"
            echo "======================================"

            exit 1
          fi

      # ---------------------------------------------------------
      # 10. Verify package
      # ---------------------------------------------------------
      - name: Verify installed package
        run: |
          echo "======================================"
          echo "Verifying installed Tuttle package"
          echo "======================================"

          if rpm -qa | grep -qi '^tuttle'; then

            echo
            echo "======================================"
            echo "✅ PASS: Tuttle package is installed"
            echo "======================================"

            rpm -qa | grep -i tuttle

          else

            echo
            echo "======================================"
            echo "❌ FAIL: Tuttle package not found"
            echo "======================================"

            exit 1
          fi

      # ---------------------------------------------------------
      # 11. Final result
      # ---------------------------------------------------------
      - name: Final result
        run: |
          echo
          echo "======================================"
          echo "✅ PASS: ${{ matrix.name }}"
          echo "======================================"
          echo
          echo "Tuttle RPM:"
          echo "${{ inputs.tag }}"
          echo
          echo "The RPM successfully installed using"
          echo "the distribution's configured repositories."
